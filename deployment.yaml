apiVersion: apps/v1
kind: Deployment
metadata:
  name: sretestapp
  labels:
    app: sretestapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sretestapp
  template:
    metadata:
      labels:
        app: sretestapp
    spec:
      containers:
      - name: sretestapp
        image: 303185496492.dkr.ecr.us-east-1.amazonaws.com/sretestapp:v4
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
